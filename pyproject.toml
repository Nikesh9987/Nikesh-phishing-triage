[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "phishing-triage"
version = "1.0.0"
description = "Phishing Triage & Header Parser: CLI and web dashboard for SOC email analysis"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Nikesh Mandal", email = "nikeshmandal.lnj@gmail.com" }]
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "python-multipart>=0.0.9",
    "jinja2>=3.1.4,<4.0",
    "pydantic>=2.8,<3.0",
    "pydantic-settings>=2.7,<3.0",
    "httpx>=0.27,<1.0",
    "dnspython>=2.6,<3.0",
    "extract-msg>=0.50,<1.0",
    "filetype>=1.2.0,<2.0",
    "oletools>=0.60.2,<1.0",
    "rich>=13.7,<15.0",
    "tldextract>=5.1,<6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.5",
    "mypy>=1.10",
    "bandit>=1.7",
    "pip-audit>=2.7",
]

[project.scripts]
phishtriage = "phishtriage.cli.main:main"
phishtriage-api = "phishtriage.api.app:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"phishtriage.api" = ["templates/*.html", "static/**/*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "C4", "SIM"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q --cov=phishtriage --cov-report=term-missing"