# Phishing Triage: local container deployment.
#
#   cp .env.example .env        # optional: API keys and settings
#   docker compose up -d --build
#   open http://127.0.0.1:8000/
#
# Values below use ${NAME:-default} interpolation, so anything you put in the
# .env file next to this file (or export in your shell) is picked up.
# Secrets are passed at run time and never stored in the image.

services:
  phishtriage:
    build:
      context: .
      dockerfile: Dockerfile
    image: phishing-triage:1.0.0
    init: true
    restart: unless-stopped
    stop_grace_period: 20s

    # No authentication is built in. Bind to localhost unless a reverse proxy
    # with authentication sits in front (see DEPLOYMENT.md).
    ports:
      - "${PHISHTRIAGE_BIND:-127.0.0.1}:${PHISHTRIAGE_API_PORT:-8000}:${PHISHTRIAGE_API_PORT:-8000}"

    environment:
      PHISHTRIAGE_ENVIRONMENT: ${PHISHTRIAGE_ENVIRONMENT:-production}
      PHISHTRIAGE_LOG_LEVEL: ${PHISHTRIAGE_LOG_LEVEL:-INFO}
      PHISHTRIAGE_LOG_FORMAT: ${PHISHTRIAGE_LOG_FORMAT:-text}
      PHISHTRIAGE_OFFLINE: ${PHISHTRIAGE_OFFLINE:-false}
      PHISHTRIAGE_API_PORT: ${PHISHTRIAGE_API_PORT:-8000}
      PHISHTRIAGE_API_RATE_LIMIT_PER_MINUTE: ${PHISHTRIAGE_API_RATE_LIMIT_PER_MINUTE:-30}
      PHISHTRIAGE_MAX_UPLOAD_BYTES: ${PHISHTRIAGE_MAX_UPLOAD_BYTES:-26214400}
      PHISHTRIAGE_ENABLE_API_DOCS: ${PHISHTRIAGE_ENABLE_API_DOCS:-false}
      PHISHTRIAGE_DNS_NAMESERVERS: ${PHISHTRIAGE_DNS_NAMESERVERS:-}
      PHISHTRIAGE_API_CORS_ORIGINS: ${PHISHTRIAGE_API_CORS_ORIGINS:-}
      # Threat-intelligence keys. Empty means "not configured".
      URLHAUS_AUTH_KEY: ${URLHAUS_AUTH_KEY:-}
      ABUSEIPDB_API_KEY: ${ABUSEIPDB_API_KEY:-}
      VIRUSTOTAL_API_KEY: ${VIRUSTOTAL_API_KEY:-}
      # Only needed behind a reverse proxy: the proxy address(es) whose
      # X-Forwarded-For header uvicorn may trust, so per-client rate limiting
      # sees real client addresses. Never set this to "*" on an exposed port.
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-127.0.0.1}

    # ---- hardening
    read_only: true
    tmpfs:
      # Spooled uploads and temporary files live in RAM only. Raise the size if
      # you raise PHISHTRIAGE_MAX_UPLOAD_BYTES.
      - /tmp:rw,noexec,nosuid,nodev,size=128m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 1g
    cpus: 2

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"